name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: priyasa
          MYSQL_USER: priyasa
          MYSQL_PASSWORD: priyasa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://priyasa:priyasa@127.0.0.1:3306/priyasa
      SESSION_SECRET: ci-only-secret-change-me
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:prepare:mysql
      - run: npx prisma validate --schema prisma/schema.mysql.prisma
      - run: npx prisma generate --schema prisma/schema.mysql.prisma
      - run: npx prisma db push --schema prisma/schema.mysql.prisma --skip-generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
